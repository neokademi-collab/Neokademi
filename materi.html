<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | Neokademi</title>
    
    <script>
        // Proteksi Sesi Login
        (function() {
            const rawData = localStorage.getItem('neokademi_user');
            if (!rawData) {
                window.location.replace('login.html'); 
            } else {
                const session = JSON.parse(rawData);
                const now = new Date().getTime();
                if (!session.isLoggedIn || !session.expiry || now > session.expiry) {
                    localStorage.removeItem('neokademi_user');
                    alert("Sesi Anda telah berakhir. Silakan login kembali.");
                    window.location.replace('login.html');
                }
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        primary: '#385DFF', /* BuddyBoss Blue */
                        primaryHover: '#1E42DD', 
                        danger: '#EB4E4F',
                        darkBg: '#0f172a', 
                        darkCard: '#1e293b', 
                        darkSidebar: '#111827',
                        borderColor: '#E7E9EC',
                        textColor: '#4D5C6D'
                    } 
                } 
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        .active-chapter { 
            background-color: rgba(56, 93, 255, 0.05); 
            border-left: 3px solid #385DFF;
        }
        .dark .active-chapter { 
            background-color: rgba(56, 93, 255, 0.1); 
        }

        .completed-icon { color: #1CD991; }
        
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade { animation: fade-in 0.3s ease-out forwards; }
        .sidebar-transition { transition: margin-left 0.3s ease-in-out, transform 0.3s ease-in-out; }
    </style>
</head>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyJcarKrJQUYKMK81f531gpgwY8UVQxSVz6NExABGst1fnprd8DnCdhIH0VpQzeDg/exec';
        const MIN_SCORE_PASS = 80;

        const courseData = {
            "linux": {
                courseName: "Linux System Administration",
                chapters: [
                    { 
                        id: 1, 
                        title: "1. Instalasi & Pemahaman Direktori", 
                        video: "https://www.youtube.com/embed/wBp0Rb-ZJak", 
                        desc: `<p>Pelajari fondasi utama sistem operasi Linux, yaitu struktur direktorinya (Filesystem Hierarchy Standard).</p>` 
                    },
                    { 
                        id: 2, 
                        title: "2. Manajemen User, Group & Permission", 
                        video: "https://www.youtube.com/embed/rrB13utjYV4", 
                        desc: `<p>Membahas cara mengelola pengguna dan membatasi hak akses file agar server aman.</p>` 
                    },
                    { 
                        id: 3, 
                        title: "3. Manajemen Paket & Repository", 
                        video: "https://www.youtube.com/embed/v_1zbOUXYzI", 
                        desc: `<p>Cara menginstal dan memperbarui aplikasi di Linux menggunakan APT/YUM.</p>` 
                    }
                ]
            }
        };

        const quizData = [
            { q: "Apa direktori utama tertinggi pada struktur file Linux?", options: ["/home", "/root", "/", "/bin"], ans: 2 },
            { q: "Perintah apa yang digunakan untuk menampilkan daftar isi direktori?", options: ["cd", "ls", "pwd", "mkdir"], ans: 1 },
            { q: "Angka berapa yang merepresentasikan hak akses penuh (Read, Write, Execute)?", options: ["5", "6", "7", "4"], ans: 2 }
        ];

        let activeModulKey = "linux";
        let activeData = courseData[activeModulKey];
        let currentChapterId = null;
        let completedChapters = [];
        let userEmail = "";
        let progressKey = ""; 
        let quizScoreKey = "";
        let quizAnswersKey = "";
        
        let quizScoreVal = null; 
        let currentQuizIndex = 0;
        let selectedOption = null;
        let userAnswers = [];
        let userCertUrl = "";

        async function initializeData() {
            const rawUserData = localStorage.getItem('neokademi_user');
            if(rawUserData) {
                const session = JSON.parse(rawUserData);
                userEmail = session.email;
                if(session.modul && courseData[session.modul]) {
                    activeModulKey = session.modul;
                    activeData = courseData[activeModulKey];
                }
                
                progressKey = 'neokademi_progress_' + userEmail.trim().toLowerCase(); 
                quizScoreKey = 'neokademi_quizscore_' + userEmail.trim().toLowerCase();
                quizAnswersKey = 'neokademi_quizanswers_' + userEmail.trim().toLowerCase();
                
                document.getElementById('user-greeting').textContent = userEmail.split('@')[0];
                document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${userEmail.charAt(0)}&background=385DFF&color=fff`;
                document.getElementById('back-to-course-link').href = `detail.html?modul=${activeModulKey}`;
                
                try {
                    const response = await fetch(`${GAS_URL}?action=getProgress&email=${encodeURIComponent(userEmail)}&t=${new Date().getTime()}`);
                    const result = await response.json();
                    
                    if(result.status === 'success') {
                        userCertUrl = result.certificate || "";
                        if(result.progress) {
                            completedChapters = result.progress.split(',').map(Number);
                            localStorage.setItem(progressKey, JSON.stringify(completedChapters));
                        } else {
                            completedChapters = [];
                        }

                        if(result.quiz !== undefined && result.quiz !== "") {
                            quizScoreVal = parseInt(result.quiz);
                            localStorage.setItem(quizScoreKey, quizScoreVal);
                            if(result.answers) {
                                userAnswers = JSON.parse(result.answers);
                                localStorage.setItem(quizAnswersKey, JSON.stringify(userAnswers));
                            }
                        }
                    }
                } catch(err) {
                    completedChapters = JSON.parse(localStorage.getItem(progressKey)) || [];
                    const localScore = localStorage.getItem(quizScoreKey);
                    if(localScore !== null) quizScoreVal = parseInt(localScore);
                }
            }

            document.getElementById('course-title').textContent = activeData.courseName;
            document.getElementById('breadcrumb-course').textContent = activeData.courseName;
            
            document.getElementById('global-loader').classList.add('opacity-0');
            setTimeout(() => document.getElementById('global-loader').classList.add('hidden'), 300);

            // Tentukan bab yang akan dimuat
            const lastCompletedIndex = completedChapters.length;
            if(lastCompletedIndex < activeData.chapters.length) {
                const nextChap = activeData.chapters[lastCompletedIndex] || activeData.chapters[0];
                loadChapter(nextChap.id);
            } else {
                openQuizPage();
            }
        }

        function sendDataBeacon(action, dataValue, extraData = "") {
            const paramName = action === 'saveQuiz' ? 'score' : 'progress';
            let url = `${GAS_URL}?action=${action}&email=${encodeURIComponent(userEmail)}&${paramName}=${encodeURIComponent(dataValue)}&t=${new Date().getTime()}`;
            if(action === 'saveQuiz' && extraData) url += `&answers=${encodeURIComponent(extraData)}`;
            const beacon = new Image(); beacon.src = url;
        }

        function renderSidebar() {
            const listEl = document.getElementById('chapter-list');
            listEl.innerHTML = ''; 
            
            activeData.chapters.forEach((chap) => {
                const isCompleted = completedChapters.includes(chap.id);
                const isActive = currentChapterId === chap.id;
                
                let iconHtml = isCompleted 
                    ? `<i class="fa-solid fa-check text-[#1CD991] text-lg"></i>`
                    : `<div class="w-4 h-4 rounded-full border-2 border-gray-300 dark:border-gray-500 mt-0.5"></div>`;

                const btn = document.createElement('button');
                btn.className = `w-full text-left px-5 py-3.5 border-b border-borderColor dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors flex items-start group ${isActive ? 'active-chapter' : ''}`;
                btn.onclick = () => loadChapter(chap.id);
                
                btn.innerHTML = `
                    <div class="flex-shrink-0 w-6 flex justify-center mr-2 pt-0.5">${iconHtml}</div>
                    <div class="flex-1 min-w-0 pr-2">
                        <p class="text-[14px] font-medium ${isActive ? 'text-primary' : 'text-[#4D5C6D] dark:text-gray-300'} group-hover:text-primary transition-colors">${chap.title}</p>
                    </div>
                `;
                listEl.appendChild(btn);
            });

            // Tombol Quiz di Sidebar
            const allCompleted = completedChapters.length >= activeData.chapters.length;
            const isQuizActive = currentChapterId === null && !document.getElementById('quiz-container').classList.contains('hidden');
            
            const quizBtn = document.createElement('button');
            if(allCompleted) {
                quizBtn.className = `w-full text-left px-5 py-4 border-b border-borderColor dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors flex items-center group ${isQuizActive ? 'active-chapter' : ''}`;
                quizBtn.onclick = () => openQuizPage();
                let qIcon = quizScoreVal !== null && quizScoreVal >= MIN_SCORE_PASS ? `<i class="fa-solid fa-check text-[#1CD991] text-lg"></i>` : `<i class="fa-solid fa-clipboard-question text-primary text-lg"></i>`;
                quizBtn.innerHTML = `
                    <div class="flex-shrink-0 w-6 flex justify-center mr-2">${qIcon}</div>
                    <div class="flex-1 min-w-0 pr-2"><p class="text-[14px] font-medium ${isQuizActive ? 'text-primary' : 'text-[#4D5C6D] dark:text-gray-300'} group-hover:text-primary">Final Quiz</p></div>
                `;
            } else {
                quizBtn.className = `w-full text-left px-5 py-4 border-b border-borderColor dark:border-gray-800 flex items-center opacity-50 cursor-not-allowed bg-gray-50 dark:bg-darkSidebar`;
                quizBtn.innerHTML = `
                    <div class="flex-shrink-0 w-6 flex justify-center mr-2"><i class="fa-solid fa-lock text-gray-400 text-sm"></i></div>
                    <div class="flex-1 min-w-0 pr-2"><p class="text-[14px] font-medium text-gray-500">Final Quiz</p></div>
                `;
            }
            listEl.appendChild(quizBtn);
            updateProgressBar();
        }

        function updateProgressBar() {
            const total = activeData.chapters.length;
            const completedCount = completedChapters.length;
            const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);
            document.getElementById('progress-bar-fill').style.width = percent + '%';
            document.getElementById('progress-text-label').textContent = percent + '% Complete';
        }

        function navigateChapter(direction) {
            if (currentChapterId === null) {
                // Berarti sedang di kuis, back ke materi terakhir
                if (direction === 'prev') loadChapter(activeData.chapters[activeData.chapters.length-1].id);
                return;
            }
            
            const currentIndex = activeData.chapters.findIndex(c => c.id === currentChapterId);
            if (direction === 'prev' && currentIndex > 0) {
                loadChapter(activeData.chapters[currentIndex - 1].id);
            } else if (direction === 'next') {
                if (currentIndex < activeData.chapters.length - 1) {
                    loadChapter(activeData.chapters[currentIndex + 1].id);
                } else {
                    openQuizPage();
                }
            }
        }

        function loadChapter(chapterId) {
            currentChapterId = chapterId;
            document.getElementById('quiz-container').classList.add('hidden');
            const contentContainer = document.getElementById('content-container');
            contentContainer.classList.remove('hidden');
            
            const chapter = activeData.chapters.find(c => c.id === chapterId);
            const currentIndex = activeData.chapters.findIndex(c => c.id === chapterId);
            
            document.getElementById('video-player').src = chapter.video;
            document.getElementById('chapter-title').textContent = chapter.title;
            document.getElementById('breadcrumb-lesson').textContent = chapter.title;
            document.getElementById('chapter-desc').innerHTML = chapter.desc;

            // Navigasi Atas
            document.getElementById('btn-prev-nav').disabled = currentIndex === 0;
            document.getElementById('btn-next-nav').disabled = false; // Karena next bisa ke materi atau kuis

            // Status Badge & Action Button
            const isCompleted = completedChapters.includes(chapterId);
            const statusBadge = document.getElementById('status-badge');
            const actionContainer = document.getElementById('action-btn-container');

            if (isCompleted) {
                statusBadge.textContent = "Completed";
                statusBadge.className = "bg-[#1CD991] text-white text-xs font-bold px-3 py-1 rounded";
                actionContainer.innerHTML = `<button disabled class="px-6 py-2.5 bg-gray-200 text-gray-500 font-bold rounded cursor-not-allowed"><i class="fa-solid fa-check mr-2"></i> Materi Selesai</button>`;
            } else {
                statusBadge.textContent = "In Progress";
                statusBadge.className = "bg-primary text-white text-xs font-bold px-3 py-1 rounded";
                actionContainer.innerHTML = `<button onclick="markCurrentAsDone()" class="px-6 py-2.5 bg-primary hover:bg-primaryHover text-white font-bold rounded shadow-md transition-colors">Mark Complete</button>`;
            }

            renderSidebar();
            if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('main-content-area').scrollTo(0,0);
        }

        function markCurrentAsDone() {
            if (currentChapterId && !completedChapters.includes(currentChapterId)) {
                completedChapters.push(currentChapterId);
                localStorage.setItem(progressKey, JSON.stringify(completedChapters));
                sendDataBeacon('updateProgress', completedChapters.join(','));
                
                const currentIndex = activeData.chapters.findIndex(c => c.id === currentChapterId);
                if (currentIndex < activeData.chapters.length - 1) {
                    loadChapter(activeData.chapters[currentIndex + 1].id);
                } else {
                    openQuizPage();
                }
            }
        }

        // --- KUIS LOGIC ---
        function openQuizPage() {
            currentChapterId = null; 
            document.getElementById('video-player').src = ""; 
            document.getElementById('content-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');

            if (quizScoreVal !== null) {
                document.getElementById('quiz-intro').classList.add('hidden');
                document.getElementById('quiz-area').classList.add('hidden');
                showQuizResult(quizScoreVal);
            } else {
                document.getElementById('quiz-intro').classList.remove('hidden');
                document.getElementById('quiz-area').classList.add('hidden');
                document.getElementById('quiz-result').classList.add('hidden');
            }
            renderSidebar();
        }

        function startQuizEngine() {
            document.getElementById('quiz-intro').classList.add('hidden');
            document.getElementById('quiz-result').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            currentQuizIndex = 0; userAnswers = []; renderQuestion();
        }

        function renderQuestion() {
            selectedOption = null;
            const qData = quizData[currentQuizIndex];
            document.getElementById('quiz-progress-badge').textContent = `Soal ${currentQuizIndex + 1} dari ${quizData.length}`;
            document.getElementById('question-text').textContent = qData.q;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 border rounded font-medium transition-colors border-borderColor dark:border-gray-700 bg-white dark:bg-darkSidebar hover:border-primary text-[#4D5C6D] dark:text-gray-300`;
                btn.innerHTML = `<span class="inline-block w-6 font-bold text-gray-400">${String.fromCharCode(65 + index)}.</span> ${opt}`;
                btn.onclick = () => selectOption(index, btn);
                container.appendChild(btn);
            });

            const nextBtn = document.getElementById('btn-next-question');
            nextBtn.disabled = true;
            nextBtn.className = 'px-6 py-2.5 bg-gray-200 text-gray-500 font-bold rounded cursor-not-allowed';
            nextBtn.textContent = currentQuizIndex === quizData.length - 1 ? 'Selesai' : 'Selanjutnya';
        }

        function selectOption(index, btnEl) {
            selectedOption = index;
            const allBtns = document.getElementById('options-container').children;
            for(let i=0; i<allBtns.length; i++) {
                allBtns[i].className = `w-full text-left p-4 border rounded font-medium transition-colors border-borderColor dark:border-gray-700 bg-white dark:bg-darkSidebar text-[#4D5C6D] dark:text-gray-300`;
            }
            btnEl.className = `w-full text-left p-4 border rounded font-bold transition-colors border-primary bg-blue-50 dark:bg-blue-900/20 text-primary`;

            const nextBtn = document.getElementById('btn-next-question');
            nextBtn.disabled = false;
            nextBtn.className = 'px-6 py-2.5 bg-primary hover:bg-primaryHover text-white font-bold rounded shadow-md transition-colors';
        }

        function nextQuestion() {
            userAnswers[currentQuizIndex] = selectedOption;
            if(currentQuizIndex < quizData.length - 1) {
                currentQuizIndex++;
                renderQuestion();
            } else {
                let correctCount = 0;
                userAnswers.forEach((ans, i) => { if(ans === quizData[i].ans) correctCount++; });
                const finalScore = Math.round((correctCount / quizData.length) * 100);
                
                quizScoreVal = finalScore;
                localStorage.setItem(quizScoreKey, finalScore);
                localStorage.setItem(quizAnswersKey, JSON.stringify(userAnswers));
                sendDataBeacon('saveQuiz', finalScore, JSON.stringify(userAnswers));

                if (finalScore >= MIN_SCORE_PASS && (!userCertUrl || userCertUrl === "")) {
                    fetch(`${GAS_URL}?action=generateCertificate&email=${encodeURIComponent(userEmail)}`).then(r=>r.json()).then(d=>{if(d.status==='success') userCertUrl = d.url;});
                }

                document.getElementById('quiz-area').classList.add('hidden');
                showQuizResult(finalScore);
            }
            document.getElementById('main-content-area').scrollTo(0,0);
        }

        function showQuizResult(score) {
            document.getElementById('quiz-result').classList.remove('hidden');
            document.getElementById('result-score').textContent = score;
            
            const iconEl = document.getElementById('result-icon');
            const msgEl = document.getElementById('result-msg');
            const actions = document.getElementById('quiz-action-buttons');

            if(score >= MIN_SCORE_PASS) {
                iconEl.innerHTML = `<i class="fa-solid fa-trophy text-yellow-400"></i>`;
                msgEl.innerHTML = `Selamat! Anda <strong>LULUS</strong> pada modul ini.`;
                document.getElementById('result-score').className = "text-5xl font-black text-[#1CD991] mb-4";
                
                actions.innerHTML = `<button onclick="checkCertificate()" class="px-6 py-3 bg-primary hover:bg-primaryHover text-white font-bold rounded shadow-md transition-colors"><i class="fa-solid fa-award mr-2"></i> Lihat Sertifikat</button>`;
            } else {
                iconEl.innerHTML = `<i class="fa-solid fa-circle-xmark text-danger"></i>`;
                msgEl.innerHTML = `Anda <strong>BELUM LULUS</strong>. Standar kelulusan adalah ${MIN_SCORE_PASS}.`;
                document.getElementById('result-score').className = "text-5xl font-black text-danger mb-4";
                
                actions.innerHTML = `<button onclick="retakeQuiz()" class="px-6 py-3 bg-gray-800 hover:bg-gray-900 text-white font-bold rounded shadow-md transition-colors"><i class="fa-solid fa-rotate-right mr-2"></i> Ulangi Kuis</button>`;
            }
            renderSidebar();
        }

        function retakeQuiz() {
            if(confirm("Ulangi kuis dari awal? Nilai sebelumnya akan ditimpa.")) {
                quizScoreVal = null; userAnswers = []; localStorage.removeItem(quizScoreKey);
                startQuizEngine();
            }
        }

        // --- UTILS & UI ---
        function checkCertificate() {
            if (userCertUrl) { window.open(userCertUrl, '_blank'); } 
            else { alert("Sertifikat sedang diproses, silakan cek beberapa saat lagi."); }
        }

        function logout() {
            localStorage.removeItem('neokademi_user'); window.location.replace('login.html');
        }

        // Toggle Sidebar
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        function toggleMobileSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
            setTimeout(() => backdrop.classList.toggle('opacity-0'), 10);
        }
        function toggleDesktopSidebar() {
            sidebar.classList.toggle('md:-ml-[320px]');
        }

        // Toggle User Dropdown
        const userBtn = document.getElementById('user-menu-btn');
        const userDrop = document.getElementById('user-dropdown');
        userBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            userDrop.classList.toggle('opacity-0'); userDrop.classList.toggle('invisible');
        });
        document.addEventListener('click', (e) => {
            if (!userBtn.contains(e.target) && !userDrop.contains(e.target)) {
                userDrop.classList.add('opacity-0', 'invisible');
            }
        });

        // Dark Mode
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlEl = document.documentElement;

        function toggleTheme() {
            htmlEl.classList.toggle('dark');
            const isDark = htmlEl.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.className = isDark ? 'fa-solid fa-sun text-lg text-amber-400' : 'fa-solid fa-moon text-lg';
        }
        themeBtn.addEventListener('click', toggleTheme);

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlEl.classList.add('dark'); themeIcon.className = 'fa-solid fa-sun text-lg text-amber-400';
        } else {
            htmlEl.classList.remove('dark'); themeIcon.className = 'fa-solid fa-moon text-lg';
        }

        window.addEventListener('DOMContentLoaded', initializeData);
    </script>
</body>
</html>
